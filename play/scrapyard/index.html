<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0A0C11">
  <title>Robot Brawl: Scrapyard</title>
  <meta name="description" content="Drive a rookie robot across a planet, find parts in treasure chests, and challenge the machines you meet. Free, no ads.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <style>
    /* Full viewport on desktop and touch devices; the game lays out its
       own controls against the available width and height. */
    html, body { margin: 0; padding: 0; height: 100%; background: #0A0C11; overflow: hidden; }
    body { font: 15px/1.4 -apple-system, "Helvetica Neue", system-ui, sans-serif; color: #D9DEE8; }
    /* PORTAL REQUIREMENT (CrazyGames technical requirements, 2026-09-08): on
       tablets a double-tap or press-and-hold otherwise raises the magnifier
       or selects the whole game and opens a context menu. Text fields keep
       selection, or the robot-name and sign-in inputs become unusable. */
    html, body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0A0C11; }

    /* Loading: a 34 MB first visit is a real wait, so it gets a real screen
       rather than a bare progress sliver — the name, and honest progress. */
    /* ⚠ THE FAILURE SCREEN HAS TO FIT ON A PHONE, AND IT DID NOT.

       MEASURED in a 932x430 iframe — an exact viewport, which a browser window
       is not — 2026-09-13, reading getBoundingClientRect off the live page:

         normal load      8 children, column 390 px in 430 — fits
         load FAILED     10 children, column 512 px in 430
                         RETRY at top 391, BOTTOM 435 — 5 px past the viewport

       showLoadError ADDED the error paragraph and the RETRY button (and two
       more 18 px gaps) without removing the warm-up canvas, the stripe, the
       stalled bar or the tip. A centred flex column that overflows is clipped
       at BOTH ends, and body{overflow:hidden} means nothing scrolls — so a
       failed download was a dead screen with no way to retry.

       Two independent fixes, because either one alone is a single point of
       failure on a phone nobody has measured:
        1. #boot scrolls, and `justify-content: safe center` anchors a column
           taller than the viewport at the TOP instead of clipping both ends.
           Browsers that don't understand `safe` drop that line and keep the
           plain `center` above it, where fix 2 still carries the screen.
           Measured at a deliberately cruel 932x220: the column starts at the
           top, #boot scrolls 300 over 220, and scrolling to the end puts RETRY
           fully in view at 124..168.
        2. .failed hides the warm-up canvas, the hazard stripe, the stalled
           progress bar and the tip.

       AFTER, same 932x430 iframe: 6 children, column 268 px, RETRY at
       269..313 — fully in view with 117 px to spare. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      justify-content: safe center;
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding: 16px 0; box-sizing: border-box;
      background: #0A0C11; z-index: 10; transition: opacity .35s ease;
    }
    /* Nothing in the column may be squeezed to make room: a flex-shrunk RETRY
       is the same dead end as an offscreen one. */
    #boot > * { flex-shrink: 0; }
    #boot.failed #warm, #boot.failed #hazard, #boot.failed #bar, #boot.failed #tip { display: none; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .02em; color: #fff; }
    #boot h2 { margin: -10px 0 0; font-size: 17px; font-weight: 700; color: #E8C11C; letter-spacing: .06em; }
    /* the hazard stripe, borrowed from the game's own arena wall */
    #hazard { width: 220px; height: 10px; overflow: hidden; position: relative; }
    #hazard i { position: absolute; top: 0; bottom: 0; width: 22px; background: #E8C11C; transform: skewX(-24deg); }
    #bar { width: 260px; height: 6px; background: #1B1F27; border-radius: 3px; overflow: hidden; }
    #barfill { width: 0%; height: 100%; background: #E8C11C; transition: width .2s ease; }
    #boot p { margin: 0; font-size: 13px; color: #7C8698; }
    /* 2026-09-04: half of phone arrivals left during the download. A wait with
       nothing to look at is a wait people leave; this is a fight to watch and
       a tip to read, drawn in ~60 lines rather than shipped as an image. */
    #warm { width: 320px; height: 120px; display: block; }
    #tip { font-size: 13px; color: #A9B3C4; max-width: 320px; text-align: center; min-height: 36px; line-height: 1.35; }
    #priv { font-size: 11px; color: #5C657A; }
    #priv a { color: #7C8698; }
    #err { display: none; max-width: 520px; padding: 0 24px; text-align: center; color: #FF8A80; }
    #retry { display: none; min-height: 44px; padding: 10px 24px; border: 0; border-radius: 6px;
      background: #E8C11C; color: #0A0C11; font: inherit; font-weight: 700; cursor: pointer; }
    #retry:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    /* ── THE IN-APP BROWSER BAR ───────────────────────────────────────────
       ⚠ NOT a child of #boot, and that is load-bearing. #boot is a centred
       flex column that already overflowed a 430 px phone once, when
       showLoadError added two children (see the long note above). A banner
       inside it would re-open exactly that wound. This is a fixed overlay
       above everything, so it cannot change that column's height.

       Why it exists: on 2026-09-18, 362 of 366 beacon requests carried
       `musical_ly` - TikTok's webview. That cohort went 33 scene-first-frames
       to 19 arrivals in the world (58%), where desktop Safari over the same
       week went 65 to 64 (98%), and the webview raised 32 `return` events by
       repeatedly backgrounding the page, which suspends rAF and freezes a
       Unity build mid-frame. The fix that matters is getting out of the
       webview, and only the player can do that. */
    #inapp {
      position: fixed; left: 0; right: 0; top: 0; z-index: 30;
      display: none; align-items: flex-start; gap: 10px;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
      background: #E8C11C; color: #14161B;
      font-size: 13px; line-height: 1.35; font-weight: 600;
      box-shadow: 0 2px 14px rgba(0,0,0,.45);
    }
    #inapp.on { display: flex; }
    #inapp p { margin: 0; flex: 1; }
    #inapp b { font-weight: 800; }
    /* 44 px is the touch floor, and this one is pressed to get RID of the bar -
       an undersized dismiss on a bar that covers the compass is a trap. */
    #inapp button {
      flex: none; min-width: 44px; min-height: 44px; margin: -8px -4px -8px 0;
      border: 0; background: transparent; color: #14161B;
      font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;
    }
    #inapp button:focus-visible { outline: 3px solid #14161B; outline-offset: -3px; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="inapp" role="status">
    <p id="inappMsg"></p>
    <button id="inappX" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <div id="boot">
    <h1>ROBOT BRAWL</h1>
    <h2>SCRAPYARD</h2>
    <canvas id="warm" width="640" height="240"></canvas>
    <div id="hazard"></div>
    <div id="bar"><div id="barfill"></div></div>
    <p id="pct">loading…</p>
    <p id="tip"></p>
    <div id="err" role="alert"></div>
    <button id="retry" type="button">RETRY LOADING</button>
    <!-- The game counts anonymous progress milestones with an id that lives in
         memory for the tab and is never stored. Portals require the notice. -->
    <p id="priv">anonymous play counts, no account needed &middot;
      <a href="https://cyberduck.club/privacy/" target="_blank" rel="noopener">privacy</a></p>
  </div>

  <script>
    // ── SOMETHING TO WATCH WHILE IT LOADS ────────────────────────────────
    // Two robots charge, collide, spark, reset. Tips rotate underneath.
    var stopBootPresentation = (function () {
      var c = document.getElementById("warm"), g = c.getContext("2d");
      var running = true, frameId = null, tipTimer = null;
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W = c.width, H = c.height, t0 = null, sparks = [];
      function bot(x, y, dir, body, accent) {
        g.fillStyle = body; g.fillRect(x - 34, y - 26, 68, 26);            // frame
        g.fillStyle = accent; g.fillRect(x - 14, y - 44, 28, 20);          // core
        g.fillStyle = "#2A2E36";                                           // wheels
        [[-24, 0], [24, 0]].forEach(function (w) { g.beginPath(); g.arc(x + w[0], y + 2, 12, 0, 6.283); g.fill(); });
        g.fillStyle = "#B8C0CC"; g.beginPath();                            // spike
        g.moveTo(x + dir * 34, y - 22); g.lineTo(x + dir * 58, y - 13); g.lineTo(x + dir * 34, y - 4); g.fill();
      }
      function frame(ts) {
        if (!running || !g) return;
        if (t0 === null) t0 = ts;
        var p = ((ts - t0) % 2600) / 2600;                                 // one bout per 2.6 s
        var gap = p < 0.55 ? (1 - p / 0.55) : 0;                           // charge, then locked
        var lx = W * 0.5 - 70 - gap * 200, rx = W * 0.5 + 70 + gap * 200, y = H * 0.62;
        g.clearRect(0, 0, W, H);
        g.fillStyle = "#151920"; g.fillRect(0, y + 14, W, 6);              // floor
        g.fillStyle = "#E8C11C"; for (var i = 0; i < W; i += 40) g.fillRect(i, y + 14, 20, 6);
        bot(lx, y, 1, "#D9DEE8", "#3F5D4B"); bot(rx, y, -1, "#C9CED8", "#8B3A3A");
        if (p > 0.55 && p < 0.60 && sparks.length < 40)
          for (var k = 0; k < 12; k++) sparks.push({ x: W * 0.5, y: y - 14, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 7, a: 1 });
        for (var j = sparks.length - 1; j >= 0; j--) {
          var s = sparks[j]; s.x += s.vx; s.y += s.vy; s.vy += 0.35; s.a -= 0.03;
          if (s.a <= 0) { sparks.splice(j, 1); continue; }
          g.fillStyle = "rgba(255,200,60," + s.a + ")"; g.fillRect(s.x, s.y, 4, 4);
        }
        if (!reduce) frameId = requestAnimationFrame(frame);
      }
      frameId = requestAnimationFrame(frame);
      var tips = [
        "You drive the fight: use WASD, arrow keys, or the on-screen stick.",
        "Your starter spike works on impact. Ram with the front, then reverse to line up another hit.",
        "FIRE (Space) is for powered weapons. Your starter spike needs no FIRE button.",
        "Drive into treasure chests to collect scrap and parts for your robot.",
        "Heavy parts mounted LOW help keep a machine on its wheels.",
        "Open GARAGE to fit your new parts, save, then drive out and challenge another robot."
      ];
      var tipEl = document.getElementById("tip"), ti = Math.floor(Math.random() * tips.length);
      tipEl.textContent = tips[ti];
      tipTimer = setInterval(function () { ti = (ti + 1) % tips.length; tipEl.textContent = tips[ti]; }, 3500);
      return function () {
        running = false;
        if (frameId !== null) cancelAnimationFrame(frameId);
        if (tipTimer !== null) clearInterval(tipTimer);
        frameId = tipTimer = null;
        sparks.length = 0;
      };
    })();

    // hazard stripe, drawn rather than shipped as an image
    (function () {
      var h = document.getElementById("hazard");
      for (var i = -1; i < 12; i++) {
        var s = document.createElement("i");
        s.style.left = (i * 44) + "px";
        h.appendChild(s);
      }
    })();


    // ── VISIT COUNTER ────────────────────────────────────────────────────
    // GitHub Pages keeps no access logs, so the page counts itself: one
    // fire-and-forget request to OUR OWN api, whose Cloud Run request log
    // becomes the counter. Deliberate design notes, because each is load-
    // bearing and none is obvious:
    //
    //  * The path 404s ON PURPOSE. Nothing is written, no database is
    //    touched, no endpoint has to exist or be maintained — Cloud Run logs
    //    the request either way. The alert policy watches the 5xx RATE only
    //    (server/scripts/gcp_monitoring.zsh), so a stream of 404s cannot page
    //    anyone. The path is named to read as intentional in a log tail.
    //  * mode:"no-cors" means we never read the response, so this needs no
    //    CORS entry and cannot fail loudly.
    //  * keepalive lets the "open" hit survive a visitor who leaves during
    //    the 33 MB download — which is exactly the visitor we most want to
    //    count.
    //  * Only the tab's ephemeral id and coarse progress fields are sent;
    //    no cookies, account details, error messages or fingerprint. The id
    //    described below is never persisted or shared across sites.
    var BEACON = "https://rb-api-902243335343.us-central1.run.app/v1/beacon/scrapyard-play";

    // ── THE EPHEMERAL SESSION ID ─────────────────────────────────────────
    // Generated here, held only in this closure, and never written to
    // localStorage, a cookie, IndexedDB or anywhere else. It exists so the
    // hits below can be grouped into a funnel — "did the person who opened
    // the page also finish a fight" is unanswerable without it, and grouping
    // by IP merges every phone behind one carrier NAT into a single fictional
    // player. Because it is not persisted it CANNOT follow anyone across
    // sessions, days or sites, which is what keeps the privacy policy's "no
    // tracking across apps or websites" true as written.
    var RBID = (function () {
      try {
        if (crypto && crypto.randomUUID) return crypto.randomUUID().slice(0, 8);
        var a = new Uint8Array(4); crypto.getRandomValues(a);
        return Array.from(a, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      } catch (e) { return "nocrypto"; }
    })();

    // The ONE place that knows how a hit is sent. Game code (via the
    // rbbeacon.jslib shim) calls window.rbBeacon and never touches the URL.
    function beacon(ev, extra) {
      try {
        fetch(BEACON + "?e=" + encodeURIComponent(ev) + "&i=" + RBID + (extra || ""),
              { mode: "no-cors", keepalive: true, cache: "no-store", credentials: "omit" })
          .catch(function () { /* offline counting must not become a JS error */ });
      } catch (e) { /* counting must never break the game */ }
    }
    window.rbBeacon = function (ev, extra) {
      if (ev === "boot") notePhase("boot");
      // The bar retires the moment the player actually drives - the same
      // condition the game's own keyboard hint uses. Until then it is allowed
      // to sit over the compass strip, because someone who has arrived and not
      // moved is precisely who it is for.
      if (ev === "moved") hideInApp();
      beacon(ev, extra);
    };

    // ── IN-APP BROWSER DETECTION ──────────────────────────────────────────
    // Name only the webviews we have actually seen or that are known to host
    // WebGL badly. `musical_ly` is TikTok on both platforms (the Android
    // package is com.zhiliaoapp.musically); Trill and Bytedance are TikTok's
    // other builds. This is a HINT, not a gate: nothing is blocked, and a
    // false positive costs one dismissable bar.
    function inAppBrowser() {
      var u = navigator.userAgent || "";
      if (/musical_ly|Trill|Bytedance|BytedanceWebview/i.test(u)) return "tiktok";
      if (/Instagram/i.test(u)) return "instagram";
      if (/FBAN|FBAV|FB_IAB/i.test(u)) return "facebook";
      if (/Snapchat/i.test(u)) return "snapchat";
      if (/\bLine\//i.test(u)) return "line";
      return null;
    }
    var inappEl = document.getElementById("inapp");
    function hideInApp() { if (inappEl) inappEl.classList.remove("on"); }
    (function () {
      var which = inAppBrowser();
      if (!which || !inappEl) return;
      try { if (sessionStorage.getItem("rb_inapp_x")) return; } catch (e) {}
      // Both TikTok builds put the escape hatch behind the same control, but
      // it is a different glyph per platform and naming the wrong one is worse
      // than naming none: a player who cannot find what we told them to find
      // concludes the advice is wrong and stops reading.
      var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
      var dots = ios ? "\u00B7\u00B7\u00B7" : "\u22EE";
      var browser = ios ? "Safari" : "Chrome";
      document.getElementById("inappMsg").innerHTML =
        "This is " + (which === "tiktok" ? "TikTok" : "an in-app") +
        "\u2019s built-in browser, and 3D games run poorly in it. " +
        "<b>Tap " + dots + " at the top, then \u201cOpen in browser\u201d</b> to play in " +
        browser + ".";
      inappEl.classList.add("on");
      beacon("inapp", "&b=" + which);   // so we can measure whether this helps
      document.getElementById("inappX").addEventListener("click", function () {
        hideInApp();
        try { sessionStorage.setItem("rb_inapp_x", "1"); } catch (e) {}
      });
    })();

    var tOpen = Date.now();
    beacon("open");
    // SAME-TAB RELOAD (plan step 0, 2026-09-07): the funnel's biggest hole is
    // 71 silent sessions a week and 76 that downloaded everything and never
    // drew a frame - on an iPhone-heavy audience that smells like Safari
    // killing the tab at engine start and reloading it, which the beacon
    // sees as a brand-new session at 0%. sessionStorage survives exactly
    // that reload (and a normal same-tab return), and dies with the tab.
    // `at` = the furthest phase the PREVIOUS load reached: anything short of
    // "ready" is a crash-or-abandon reload; "boot"/"ready" is a return.
    try {
      var prevPhase = sessionStorage.getItem("rb_phase");
      if (prevPhase) beacon("reload", "&at=" + prevPhase);
      sessionStorage.setItem("rb_phase", "open");
    } catch (e) {}
    function notePhase(ph) { try { sessionStorage.setItem("rb_phase", ph); } catch (e) {} }
    // WHERE DID THEY GET TO? The funnel showed half of phone arrivals never
    // reaching a playable game and could not say whether they LEFT or the
    // tab DIED (2026-09-04). `phase` is the furthest point reached; it is
    // sent once on pagehide via the keepalive fetch, so a bounce arrives as
    // a `leave` carrying the phase and a crash arrives as silence.
    var phase = "open", sentMilestone = {};
    function milestone(m) { if (!sentMilestone[m]) { sentMilestone[m] = 1; phase = m; notePhase(m); beacon("load", "&p=" + m); } }
    var leaveSent = false;
    function leave() { if (leaveSent) return; leaveSent = true; beacon("leave", "&at=" + phase + "&s=" + Math.round((Date.now() - tOpen) / 1000)); }
    window.addEventListener("pagehide", leave);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") leave(); });
    var jsErrSent = false;
    window.addEventListener("error", function () {
      if (!jsErrSent) { jsErrSent = true; beacon("error", "&k=js&at=" + phase); }
      if (phase !== "ready") showLoadError("The game could not start. Retry loading; if it keeps happening, try an updated browser.");
    });

    var canvas = document.querySelector("#unity-canvas");
    var boot = document.getElementById("boot");
    var fill = document.getElementById("barfill");
    var pct  = document.getElementById("pct");
    var err  = document.getElementById("err");
    var retry = document.getElementById("retry"), hideBootTimer = null;
    retry.addEventListener("click", function () { window.location.reload(); });
    function showLoadError(message, kind) {
      stopBootPresentation();
      if (hideBootTimer !== null) { clearTimeout(hideBootTimer); hideBootTimer = null; }
      boot.classList.remove("done");
      boot.style.display = "flex";
      // See #boot in the stylesheet: this drops the warm-up, the stripe, the
      // stalled bar and the tip, which is what keeps RETRY on a 430 px screen.
      boot.classList.add("failed");
      boot.scrollTop = 0;
      pct.textContent = "Loading stopped";
      err.style.display = "block";
      err.textContent = message;
      retry.style.display = "block";
      if (kind) beacon("error", "&k=" + kind + "&at=" + phase); // coarse kind only; never raw error text
    }

    // ⚠ Unity 6 substitutes , NOT the older %UNITY_…% form.
    // Using the old syntax produces a page that loads nothing and says
    // nothing about why — the macros simply stay as literal text.
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webgl.data.unityweb?v=2b7b2cf21f",
      frameworkUrl: buildUrl + "/webgl.framework.js.unityweb?v=2b7b2cf21f",
      codeUrl: buildUrl + "/webgl.wasm.unityweb?v=2b7b2cf21f",
      streamingAssetsUrl: "StreamingAssets",
      // ⚠ WITHOUT THIS, THE PLAYER'S CAREER IS LOST ON RELOAD.
      // Career.Save() is a bare File.WriteAllText to persistentDataPath. On
      // WebGL that lands in an in-memory filesystem; it only reaches IndexedDB
      // when something triggers a sync. Nothing in the game does — so a save
      // survived only by luck, when an unrelated PlayerPrefs write happened to
      // flush the whole FS. Measured 2026-09-01: built a robot, armed a
      // program, fought a match, reloaded — career came back 0-0 with the
      // career file stamped at the RELOAD, not at play. This flag makes Unity
      // persist the directory on every file modification, which is the
      // documented replacement for the manual JS_FileSystem_Sync call.
      autoSyncPersistentDataPath: true,
      companyName: "owen",
      productName: "Robot Brawl: Scrapyard",
      productVersion: "0.1.0",
      showBanner: function (msg, type) {
        if (type === "error" && phase !== "ready")
          showLoadError("The game could not finish loading. Retry loading; if it keeps happening, try an updated browser.", "banner");
        else { console.log("[unity] " + msg); }
      },
    };

    // Match the drawing buffer to the real viewport on desktop and touch.
    function fit() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
    }
    fit();
    window.addEventListener("resize", fit);

    var script = document.createElement("script");
    script.src = buildUrl + "/webgl.loader.js?v=2b7b2cf21f";
    script.onload = function () {
      // Promise wrapping catches a missing/throwing loader as well as an
      // asynchronous engine failure; both leave the same usable retry door.
      Promise.resolve().then(function () {
        return createUnityInstance(canvas, config, function (p) {
        var n = Math.round(p * 100);
        if (n >= 25) milestone("25"); if (n >= 50) milestone("50"); if (n >= 75) milestone("75");
        if (n >= 100) { milestone("starting"); }   // download done, engine starting - the phase the silent sessions die in
        fill.style.width = n + "%";
        pct.textContent = n < 100 ? ("loading… " + n + "%") : "starting the engine… (on phones this is the slow part)";
        });
      }).then(function () {
        // How many who opened the page actually got a playable game, and how
        // long it took them. On a 33 MB payload this ratio is the single most
        // useful number about the port.
        phase = "ready"; notePhase("ready");
        beacon("ready", "&s=" + Math.round((Date.now() - tOpen) / 1000));
        stopBootPresentation();
        boot.classList.add("done");
        hideBootTimer = setTimeout(function () { boot.style.display = "none"; hideBootTimer = null; }, 400);
      }).catch(function () {
        showLoadError("The game could not start. Retry loading; if it keeps happening, try an updated browser.", "loader");
      });
    };
    script.onerror = function () {
      showLoadError("The game files could not be downloaded. Check your connection, then retry loading.", "download");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
